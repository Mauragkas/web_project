<!doctype html>
<html lang="en">
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Thesis Management System</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body
        class="animated-gradient h-screen flex items-center justify-center p-4"
    >
        <div
            class="bg-white bg-opacity-90 backdrop-blur-lg p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-200"
        >
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">
                Login
            </h2>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label
                        for="username"
                        class="block text-sm font-semibold text-gray-700 mb-1"
                        >Username</label
                    >
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out placeholder-gray-400"
                        placeholder="Enter your username"
                        required
                    />
                </div>
                <div>
                    <label
                        for="password"
                        class="block text-sm font-semibold text-gray-700 mb-1"
                        >Password</label
                    >
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out placeholder-gray-400"
                        placeholder="Enter your password"
                        required
                    />
                </div>
                <div
                    id="loginMessage"
                    class="text-center text-sm font-medium hidden"
                ></div>

                <button
                    type="submit"
                    class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75 transition duration-150 ease-in-out transform hover:scale-105"
                >
                    Login
                </button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">
                <a
                    href="#"
                    class="text-indigo-600 hover:underline hover:text-indigo-800 transition duration-150 ease-in-out"
                >
                    Forgot Password?
                </a>
            </p>
        </div>

        <!-- Scripts -->
        <script type="module" src="/js/main.js"></script>
    </body>
</html>
