<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>404 Not Found</title>
        <link rel="stylesheet" href="/css/style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
        <div class="text-center">
            <h1
                class="text-[10rem] font-extrabold text-indigo-700 mb-4 leading-none drop-shadow-lg"
                style="letter-spacing: -0.05em"
            >
                404
            </h1>
            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
                Page Not Found
            </h2>
            <p class="text-lg text-gray-600 mb-8">
                Sorry, the page you are looking for does not exist or you do not
                have access.
            </p>
            <a href="/" class="btn btn-primary text-lg px-10 py-4">Go Home</a>
        </div>
    </body>
</html>
