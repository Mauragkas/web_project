<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>404 Not Found</title>
        <link rel="stylesheet" href="/css/style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
        <div class="text-center">
            <h1
                class="text-9xl font-extrabold text-indigo-700 mb-6 drop-shadow-lg"
            >
                404
            </h1>
            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
                Page Not Found
            </h2>
            <p class="text-lg text-gray-600 mb-8">
                Sorry, the page you are looking for does not exist or you do not
                have access.
            </p>
            <a
                href="/"
                class="inline-block px-8 py-3 bg-indigo-600 text-white text-lg font-semibold rounded-lg shadow hover:bg-indigo-700 transition"
            >
                Go Home
            </a>
        </div>
    </body>
</html>
