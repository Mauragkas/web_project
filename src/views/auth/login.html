<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Page</title>
        <!-- Tailwind CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet"
        />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Droid+Sans:wght@400;700&display=swap");
            * {
                font-family: "Droid Sans", sans-serif;
            }
            @keyframes gradientBackground {
                0% {
                    background-position: 0% 50%;
                    background-color: #ffb3a7;
                }
                25% {
                    background-position: 50% 50%;
                    background-color: #d1b3ff;
                }
                50% {
                    background-position: 100% 50%;
                    background-color: #b3c7e7;
                }
                75% {
                    background-position: 50% 50%;
                    background-color: #c1b3ff;
                }
                100% {
                    background-position: 0% 50%;
                    background-color: #c1e7e4;
                }
            }
            .animated-gradient {
                background: linear-gradient(
                    45deg,
                    #ffb3a7,
                    #d1b3ff,
                    #b3c7e7,
                    #c1b3ff,
                    #c1e7e4
                );
                background-size: 200% 200%;
                animation: gradientBackground 15s ease infinite;
            }
        </style>
    </head>
    <body class="animated-gradient h-screen flex items-center justify-center">
        <div
            class="bg-white bg-opacity-90 backdrop-blur-lg p-8 rounded-lg shadow-lg w-full max-w-md"
        >
            <h2 class="text-3xl font-semibold text-center text-gray-800 mb-6">
                Login
            </h2>
            <form class="space-y-6">
                <div>
                    <label
                        for="username"
                        class="block text-sm font-medium text-gray-700"
                    <label
                        for="username"
                        class="block text-sm font-medium text-gray-700"
                        >Username</label
                    >
                    <input
                        type="text"
                        id="username"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Enter your username"
                        required
                    />
                </div>
                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-700"
                        >Password</label
                    >
                    <input
                        type="password"
                        id="password"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Enter your password"
                        required
                    />
                </div>
                <button
                    type="submit"
                    class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75"
                >
                    Login
                </button>
                <button
                    type="button"
                    class="w-full py-2 px-4 bg-gray-800 text-white font-semibold rounded-lg shadow-md hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-75 flex items-center justify-center"
                >
                    <svg
                        class="w-5 h-5 mr-2"
                        fill="currentColor"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M12 0C5.373 0 0 5.373 0 12c0 5.302 3.438 9.8 8.205 11.387.6.111.82-.261.82-.577 0-.285-.01-1.04-.015-2.04-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.304.76-1.604-2.665-.305-5.466-1.332-5.466-5.93 0-1.31.467-2.38 1.235-3.22-.125-.303-.535-1.523.115-3.176 0 0 1.005-.322 3.3 1.23.955-.265 1.98-.398 3-.403 1.02.005 2.045.138 3 .403 2.28-1.552 3.285-1.23 3.285-1.23.655 1.653.245 2.873.12 3.176.77.84 1.235 1.91 1.235 3.22 0 4.61-2.805 5.62-5.475 5.92.43.37.815 1.102.815 2.222 0 1.606-.015 2.896-.015 3.286 0 .32.215.694.825.576C20.565 21.795 24 17.297 24 12c0-6.627-5.373-12-12-12z"
                        />
                    </svg>
                    Login with GitHub
                </button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">
                <a href="forgot_pass.html" class="text-indigo-600 hover:underline"
                    >Forgot Password?</a
                >
                |
                <a href="create_acc.html" class="text-indigo-600 hover:underline"
                    >Create an Account</a
                >
            </p>
        </div>
    </body>
</html>
